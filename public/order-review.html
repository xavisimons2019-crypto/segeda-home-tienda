<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión de arrastre</title><style>body{margin:0;background:#eee7df;font:14px Arial;color:#514741}header{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;background:#fffaf6}button{padding:8px;border:1px solid #dacec3;border-radius:9px;color:inherit;background:white}button[aria-pressed=true]{background:#a75865;color:white}iframe{display:block;width:390px;height:850px;border:0;margin:12px auto;background:white}pre{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><header><b>Revisión · ordenar productos</b><button data-width="360">360 px</button><button data-width="390">390 px</button><button data-width="412">412 px</button><button data-width="430">430 px</button><button data-width="1120">PC</button><button id="measure">Comprobar medidas</button></header><iframe id="panel" title="Panel de prueba" src="/order-lab.html"></iframe><pre id="result"></pre><script>const frame=document.querySelector('iframe');function measure(){const d=frame.contentDocument;document.querySelector('#result').textContent=JSON.stringify({width:frame.contentWindow.innerWidth,scrollWidth:d.documentElement.scrollWidth,rows:d.querySelectorAll('.product-order-row').length,handles:[...d.querySelectorAll('.product-drag-handle')].slice(0,3).map(el=>({width:el.getBoundingClientRect().width,height:el.getBoundingClientRect().height,touchAction:getComputedStyle(el).touchAction,disabled:el.disabled})),order:d.querySelector('#qa-order')?.textContent},null,2)}for(const b of document.querySelectorAll('[data-width]'))b.onclick=()=>{frame.style.width=b.dataset.width+'px';for(const c of document.querySelectorAll('[data-width]'))c.setAttribute('aria-pressed',String(c===b));measure()};document.querySelector('#measure').onclick=measure;frame.onload=()=>{const style=frame.contentDocument.createElement('style');style.textContent='::-webkit-scrollbar{width:0;height:0}html{scrollbar-width:none}';frame.contentDocument.head.append(style);measure()};</script></body></html>
