<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión responsive de administración</title><style>body{margin:0;padding:8px;background:#eee;font:14px system-ui}header{display:flex;gap:10px;flex-wrap:wrap;padding:8px}iframe{height:850px;border:1px solid #aaa;background:white;display:block}button{padding:8px}</style></head><body><header><label>Ancho <select id="width"><option>360</option><option>390</option><option>412</option><option>430</option><option selected>1100</option></select></label><button id="reload">Recargar panel</button><button id="reset">Restablecer datos de prueba</button><button id="fail">Fallar próximo guardado</button><span>Datos ficticios · Sin acceso al panel real</span></header><iframe id="panel" title="Panel de prueba aislado" src="/admin-review/qa-admin.html" width="1100"></iframe><script>const panel=document.querySelector('#panel');document.querySelector('#width').onchange=e=>panel.style.width=e.target.value+'px';document.querySelector('#reload').onclick=()=>panel.src=panel.src;document.querySelector('#reset').onclick=()=>panel.contentWindow.postMessage('reset',location.origin);document.querySelector('#fail').onclick=()=>panel.contentWindow.postMessage('fail-save',location.origin);</script></body></html>
