<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segeda Home · Revisión de catálogo</title><style>*{box-sizing:border-box}body{margin:0;background:#eee8e2;color:#514741;font:14px system-ui}header{padding:12px 20px;display:flex;gap:12px;align-items:center;background:#fffdf9;flex-wrap:wrap}select,button{padding:8px;border:1px solid #d9ccbf;border-radius:10px;background:#fff;color:#514741}main{display:flex;justify-content:center;padding:12px}iframe{display:block;width:405px;height:calc(100vh - 88px);min-height:640px;border:0;border-radius:12px;background:#fff}small{color:#877b70}</style></head><body><header><b>Segeda Home · Revisión</b><label>Ancho <select id="width"><option>360</option><option selected>390</option><option>412</option><option>430</option><option>768</option><option>1024</option><option>1120</option><option>1280</option></select></label><label>Página <select id="page"><option value="/catalogo">Inicio</option><option value="/catalogo?categoria=placas">Placas</option><option value="/catalogo?categoria=cuadros">Cuadros</option><option value="/nubes">Nubes</option><option value="/navidad">Navidad</option></select></label><button id="down">Bajar una pantalla</button><button id="up">Subir una pantalla</button><small>Vista de revisión · Cambios pendientes de publicar</small></header><main><iframe id="store" title="Tienda de revisión" src="/catalogo"></iframe></main><script>const frame=document.querySelector('#store'),width=document.querySelector('#width');function resize(){const target=Number(width.value);frame.style.width=target+'px';requestAnimationFrame(()=>{const doc=frame.contentDocument;if(doc)frame.style.width=(target+frame.offsetWidth-doc.documentElement.clientWidth)+'px'})}width.addEventListener('change',resize);frame.addEventListener('load',resize);document.querySelector('#page').addEventListener('change',event=>{frame.src=event.target.value});document.querySelector('#down').addEventListener('click',()=>frame.contentWindow.scrollBy({top:frame.contentWindow.innerHeight*.85,behavior:'instant'}));document.querySelector('#up').addEventListener('click',()=>frame.contentWindow.scrollBy({top:-frame.contentWindow.innerHeight*.85,behavior:'instant'}));</script></body></html>
