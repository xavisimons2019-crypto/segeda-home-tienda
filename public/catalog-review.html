<!doctype html><html lang="es"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión de tarjetas · Segeda</title><style>body{margin:0;background:#eee6df;color:#59483e;font:14px system-ui}header{padding:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fffaf5}button{border:1px solid #dacabd;background:#fffaf5;border-radius:8px;padding:9px;color:#59483e;cursor:pointer}button[aria-pressed=true]{background:#a75865;color:white}iframe{display:block;width:390px;height:860px;border:0;margin:12px auto;background:#fff}pre{padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:1000px;margin:auto;font-size:12px}h1{font-size:14px;margin:0 12px 0 0}</style><header><h1>Revisión responsive · catálogo real</h1><button data-width="360">360 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="412">412 px</button><button data-width="430">430 px</button><button id="cards">Ver tarjetas</button><button id="reference">Ver diseños 011–014</button><button id="measure">Comprobar medidas</button></header><iframe id="catalog" title="Catálogo móvil" src="/nubes"></iframe><pre id="result">Cargando catálogo…</pre><script>
const frame=document.getElementById('catalog'),output=document.getElementById('result');
function measure(){const doc=frame.contentDocument;const cards=[...doc.querySelectorAll('.model-card')];if(!cards.length)return;const width=doc.documentElement.clientWidth;const values=cards.map(card=>{const photo=card.querySelector('.model-image'),img=photo.querySelector('img'),title=card.querySelector(':scope > strong'),r=card.getBoundingClientRect(),p=photo.getBoundingClientRect(),t=title.getBoundingClientRect(),style=frame.contentWindow.getComputedStyle(title);return {title:title.textContent,width:r.width,height:r.height,imageWidth:p.width,imageHeight:p.height,imageRatio:Number((p.height/r.height).toFixed(3)),fit:img?frame.contentWindow.getComputedStyle(img).objectFit:null,imageLoaded:!!img&&img.naturalWidth>0,padding:frame.contentWindow.getComputedStyle(photo.querySelector('.safe-image')).padding,fontSize:style.fontSize,titleHeight:t.height,lineHeight:parseFloat(style.lineHeight),inside:r.left>=0&&r.right<=width+.5};});const grid=doc.querySelector('.model-grid'),style=frame.contentWindow.getComputedStyle(grid);output.textContent=JSON.stringify({width,scrollWidth:doc.documentElement.scrollWidth,gridColumns:style.gridTemplateColumns,gap:style.gap,cards:values},null,2);}
function scrollCards(index=0){const card=frame.contentDocument.querySelectorAll('.model-card')[index];if(card){frame.contentWindow.scrollTo({top:card.getBoundingClientRect().top+frame.contentWindow.scrollY-90,behavior:'instant'});}measure();}
for(const b of document.querySelectorAll('[data-width]'))b.onclick=()=>{frame.style.width=b.dataset.width+'px';for(const item of document.querySelectorAll('[data-width]'))item.setAttribute('aria-pressed',String(item===b));requestAnimationFrame(()=>scrollCards(8));};
document.getElementById('cards').onclick=()=>scrollCards();document.getElementById('reference').onclick=()=>scrollCards(8);document.getElementById('measure').onclick=measure;
frame.onload=()=>{const style=frame.contentDocument.createElement('style');style.textContent='html{scrollbar-width:none}html::-webkit-scrollbar{display:none}';frame.contentDocument.head.appendChild(style);frame.contentDocument.fonts.ready.then(()=>scrollCards(8));};
</script></html>
